[package]
name = "amm-dex"
version = "0.1.0"
description = "Constant product AMM DEX with configurable fees and slippage protection"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "amm_dex"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"
