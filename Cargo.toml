[workspace]
members = [
    "programs/token-mint",
    "programs/amm-dex",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# B3: Anchor 0.30.1 IDL builder uses proc_macro2::Span::source_file() which was
# removed from stable proc-macro2 (only available under procmacro2_semver_exempt).
# Pin proc-macro2 to 1.0.94 — the last version where source_file() is callable
# when RUSTFLAGS="--cfg procmacro2_semver_exempt" is set — so `anchor build`
# (with IDL) succeeds.
[patch.crates-io]
proc-macro2 = { version = "=1.0.94" }
